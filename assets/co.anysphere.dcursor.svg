<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3f8e"/>
      <stop offset=".45" stop-color="#243044"/>
      <stop offset="1" stop-color="#21d4ff"/>
    </linearGradient>
    <linearGradient id="armor" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f3a4d"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="larva" x1="140" y1="200" x2="372" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8ff45"/>
      <stop offset=".5" stop-color="#73d928"/>
      <stop offset="1" stop-color="#00e5c7"/>
    </linearGradient>
    <linearGradient id="dCut" x1="320" y1="120" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21d4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3f8e" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cursor-style rounded app tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#armor)" stroke="url(#frame)" stroke-width="10"/>

  <!-- Lorapok cyber accents -->
  <path d="M96 128h64M352 96h64M96 352v-64M416 352v-64" stroke="#ff4f9a" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M256 64 448 256 256 448 64 256 256 64Z" fill="none" stroke="#21d4ff" stroke-width="4" opacity="0.25"/>

  <!-- Lorapok larva body -->
  <g filter="url(#glow)">
    <circle cx="168" cy="244" r="52" fill="url(#larva)" stroke="#07111a" stroke-width="8"/>
    <ellipse cx="248" cy="252" rx="56" ry="48" fill="url(#larva)" stroke="#07111a" stroke-width="8"/>
    <ellipse cx="320" cy="268" rx="56" ry="48" fill="url(#larva)" stroke="#07111a" stroke-width="8"/>
    <ellipse cx="380" cy="292" rx="48" ry="40" fill="url(#larva)" stroke="#07111a" stroke-width="8"/>
    <circle cx="152" cy="232" r="10" fill="#061018"/>
    <circle cx="184" cy="232" r="10" fill="#061018"/>
    <path d="M140 196c-12-28-12-44 0-44M184 196c16-28 24-44 32-44" stroke="#8dff38" stroke-width="7" stroke-linecap="round"/>
    <circle cx="136" cy="148" r="8" fill="#8dff38"/>
    <circle cx="216" cy="148" r="8" fill="#8dff38"/>
  </g>

  <!-- Cursor pointer motif -->
  <path d="M332 332 468 404l-36 5 20 34-20 12-19-33-23 26V332Z" fill="#ffffff" stroke="#07111a" stroke-width="8" stroke-linejoin="round"/>

  <!-- D differentiator -->
  <path d="M352 128c48 0 88 36 88 88s-40 88-88 88h-24V128h24z" fill="url(#dCut)" opacity="0.35"/>
  <text x="368" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="700" fill="#ffffff" opacity="0.55">D</text>
</svg>
